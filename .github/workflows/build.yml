name: Build tty-clock-git for ALARM

on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    container:
      image: menci/archlinuxarm:base-devel
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable pacman sandbox
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf

      - name: Update system and install deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git ncurses github-cli

      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder .

      - name: Build package
        working-directory: ${{ github.workspace }}
        run: sudo -u builder makepkg -s --noconfirm --noprogressbar

      - name: Get package info
        id: pkg
        run: |
          PKG=$(find $GITHUB_WORKSPACE -name "*.pkg.tar.*" | head -n1)
          echo "Found: $PKG"
          BASENAME=$(basename "$PKG")
          VERSION=$(echo "$BASENAME" | sed 's/^tty-clock-git-//;s/-aarch64\.pkg\.tar\..*//')
          TAG=$(echo "$VERSION" | tr ':' '_')
          echo "file=$PKG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$TAG" >> $GITHUB_OUTPUT
          echo "date=$(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: Delete existing release if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete "${{ steps.pkg.outputs.tag }}" --yes 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/${{ steps.pkg.outputs.tag }}" 2>/dev/null || true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ steps.pkg.outputs.tag }}" \
            "${{ steps.pkg.outputs.file }}" \
            --title "tty-clock-git ${{ steps.pkg.outputs.version }}" \
            --notes "Automated build for Arch Linux ARM (aarch64)

          Package: $(basename "${{ steps.pkg.outputs.file }}")
          Built:   ${{ steps.pkg.outputs.date }}
          Arch:    aarch64

          Install:
          pacman -U $(basename "${{ steps.pkg.outputs.file }}")" \
            --latest
